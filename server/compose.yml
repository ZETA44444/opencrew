# OpenCrew server + HTTPS (Caddy gets a free certificate automatically).
# Needs server/.env with OPENCREW_TOKEN and OPENCREW_HOST (see server/README.md).
services:
  opencrew:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    environment:
      - LAUNCHER_URL=http://launcher:8788
    # No privileges, no Docker, read-only system: bot computers are requested to the launcher.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "8787"
    depends_on:
      - launcher
  # Accounts and sessions in front of the engines: one isolated engine per user (the owner keeps «opencrew»).
  gateway:
    build: ../gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - OWNER_ENGINE_URL=http://opencrew:8787
      - LAUNCHER_URL=http://launcher:8788
    volumes:
      - ./data-gateway:/data
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose:
      - "8786"
    depends_on:
      - opencrew
      - launcher
  # The only container with Docker access: creates bot computers and code sandboxes with fixed, safe settings.
  launcher:
    build:
      context: ..
      dockerfile: server/Dockerfile.launcher
    restart: unless-stopped
    environment:
      - LAUNCHER_KEY=${LAUNCHER_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8788"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - OPENCREW_HOST=${OPENCREW_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The built app (same files as GitHub Pages), served from this server.
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - opencrew
volumes:
  caddy_data: {}
  caddy_config: {}
